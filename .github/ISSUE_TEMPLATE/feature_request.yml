name: Feature request / 功能建议
description: Describe a problem and a proposed improvement / 描述问题和改进建议
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / 要解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior / 建议的行为
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / 其他方案
